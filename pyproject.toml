[project]
name = "firmable-agentic-ingestion"
version = "0.1.0"
description = "Agentic schema inference, generic extraction and conservative entity resolution (Firmable case study)"
requires-python = ">=3.11"
dependencies = ["openai>=2.8", "pydantic>=2.12", "httpx>=0.28", "PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
