source: >
  Liquor Control Victoria licence categories (15 values in the snapshot) to ANZSIC 2006. Only categories that
  identify the licensee's activity map to a code. Version 2 follows the extension critic's findings on version 1
  (run 20261112T205722-ffda3e): a BYO permit was mapped to cafes and restaurants for a ski club and tennis clubs;
  General and On-Premises licences also cover hotels, motels and function venues; BYO, Limited, Remote Seller's
  and Pre-retail licences describe a permission, not an activity. Those now emit no code.
  ANZSIC 121 is the group "Beverage Manufacturing" (a valid group-level code; the class is not stated).
