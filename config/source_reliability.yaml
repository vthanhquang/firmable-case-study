# Human-authored policy: how much we trust each PUBLISHER for each KIND of claim (ontology:
# confidence.source_reliability). This is a judgement about publishers, not about a mapping, so it is
# not agent-generated. It is versioned and stamped onto every observation.
# Groups: identifiers (abn/acn/nzbn), names (legal/trading), address, other (status, type, dates...).
version: reliability-v1

asic_companies:          # register of record for companies
  identifiers: 0.98
  names: 0.97
  address: 0.6           # registered-office data is sparse/old in the public extract
  other: 0.95
acnc_charities:          # register of record for charities; ABN-keyed
  identifiers: 0.97
  names: 0.93
  address: 0.85
  other: 0.9
ato_tax_transparency:    # ATO publication, entity names as held by ATO
  identifiers: 0.97
  names: 0.9
  address: 0.5
  other: 0.8
qbcc_licensees:          # licensing regulator; IDs entered at licence application
  identifiers: 0.85
  names: 0.85
  address: 0.8
  other: 0.75
vic_liquor:              # licensing regulator; licensee names typed into licences, no IDs
  identifiers: 0.7
  names: 0.75
  address: 0.85          # premises addresses are what the licence is about
  other: 0.7
dewr_employment_providers:  # contract-site listing; names are contract names
  identifiers: 0.7
  names: 0.65
  address: 0.8
  other: 0.6
asic_credit_licensees:
  identifiers: 0.95
  names: 0.92
  address: 0.6
  other: 0.9
default:
  default: 0.5
