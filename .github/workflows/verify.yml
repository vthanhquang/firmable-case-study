name: Verify submission
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIRMABLE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/submission.py prepare
      - run: python -m firmable.cli raw-replay --sync-demo
      - run: python scripts/submission.py verify
      - run: python -m pytest -q
      - run: npm --prefix frontend run check
      - run: node --test frontend/tests/source-pairs.test.mjs
      - run: npm --prefix frontend run build
