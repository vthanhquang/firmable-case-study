<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1400" role="img" aria-labelledby="arch-title arch-desc" font-family="Arial, sans-serif"><title id="arch-title">Firmable pipeline: discovery, AI mapping, entity matching and company profiles</title><desc id="arch-desc">Left-to-right steps connect four stages. Green nodes use AI, amber nodes involve human decisions, grey nodes retain outputs. Mapping failures loop back to revision. Matching also creates an unlinked queue and typed relationships. Parts 3 and 4 make no additional model calls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63816e"/></marker></defs><rect width="1280" height="1400" rx="10" fill="#f8f8f4"/><rect x="40" y="20" width="18" height="18" rx="3" fill="#ffffff" stroke="#cbd3c9"/><text x="67" y="35" font-size="13" font-weight="600" fill="#4a554e">CODE</text><rect x="215" y="20" width="18" height="18" rx="3" fill="#e7f0e8" stroke="#80a58a"/><text x="242" y="35" font-size="13" font-weight="600" fill="#4a554e">AI</text><rect x="390" y="20" width="18" height="18" rx="3" fill="#fbf2df" stroke="#b39354"/><text x="417" y="35" font-size="13" font-weight="600" fill="#4a554e">HUMAN</text><rect x="565" y="20" width="18" height="18" rx="3" fill="#edf0f2" stroke="#99a8b2"/><text x="592" y="35" font-size="13" font-weight="600" fill="#4a554e">SAVED ARTIFACT</text><text x="40" y="98" font-size="24" font-weight="700" fill="#235444">01</text><text x="91" y="98" font-size="24" font-weight="700" fill="#17231e">Discover useful datasets</text><text x="91" y="123" font-size="13" font-weight="400" fill="#4a554e">PART 1 / Find evidence of actual businesses</text><a href="/?part=discovery" aria-label="Catalogue API"><g><rect x="40" y="146" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="55" y="169" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="55" y="195" font-size="18" font-weight="700" fill="#17231e">Catalogue API</text><text x="55" y="220" font-size="14" font-weight="400" fill="#4a554e">1,509 deduplicated</text><text x="55" y="240" font-size="14" font-weight="400" fill="#4a554e">CKAN records</text></g></a><path d="M 260 204 H 280" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=discovery" aria-label="Preview + rank"><g><rect x="285" y="146" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="300" y="169" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="300" y="195" font-size="18" font-weight="700" fill="#17231e">Preview + rank</text><text x="300" y="220" font-size="14" font-weight="400" fill="#4a554e">Inspect columns and rows</text><text x="300" y="240" font-size="14" font-weight="400" fill="#4a554e">50 datasets / 100 points</text></g></a><path d="M 505 204 H 525" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=discovery" aria-label="Audit 20 resources"><g><rect x="530" y="146" width="220" height="116" rx="7" fill="#fbf2df" stroke="#b39354" stroke-width="2"/><text x="545" y="169" font-size="11" font-weight="700" fill="#4a554e">HUMAN</text><text x="545" y="195" font-size="18" font-weight="700" fill="#17231e">Audit 20 resources</text><text x="545" y="220" font-size="14" font-weight="400" fill="#4a554e">20 positive verdicts</text><text x="545" y="240" font-size="14" font-weight="400" fill="#4a554e">Human review verified</text></g></a><path d="M 750 204 H 770" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=discovery" aria-label="Choose sources"><g><rect x="775" y="146" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="790" y="169" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="790" y="195" font-size="18" font-weight="700" fill="#17231e">Choose sources</text><text x="790" y="220" font-size="14" font-weight="400" fill="#4a554e">Original six + extensions</text><text x="790" y="240" font-size="14" font-weight="400" fill="#4a554e">8 extracts / 7 families</text></g></a><path d="M 995 204 H 1015" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=discovery" aria-label="Source snapshots"><g><rect x="1020" y="146" width="220" height="116" rx="7" fill="#edf0f2" stroke="#99a8b2" stroke-width="1.4"/><text x="1035" y="169" font-size="11" font-weight="700" fill="#4a554e">SAVED</text><text x="1035" y="195" font-size="18" font-weight="700" fill="#17231e">Source snapshots</text><text x="1035" y="220" font-size="14" font-weight="400" fill="#4a554e">Download + hash files</text><text x="1035" y="240" font-size="14" font-weight="400" fill="#4a554e">Retain licence metadata</text></g></a><text x="40" y="296" font-size="15" font-weight="400" fill="#4a554e">Optional AI triage inspects saved resource previews; the final ranking remains deterministic.</text><path d="M 1250 204 H 1260 V 327 H 20 V 474 H 35" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><text x="465" y="318" font-size="14" font-weight="600" fill="#235444">Saved files + ontology</text><text x="40" y="368" font-size="24" font-weight="700" fill="#235444">02</text><text x="91" y="368" font-size="24" font-weight="700" fill="#17231e">Teach one engine a new source</text><text x="91" y="393" font-size="13" font-weight="400" fill="#4a554e">PART 2 / Onboard once; reuse the accepted configuration</text><a href="/?part=mapping" aria-label="Inspect + sample"><g><rect x="40" y="416" width="220" height="116" rx="7" fill="#e7f0e8" stroke="#80a58a" stroke-width="1.4"/><text x="55" y="439" font-size="11" font-weight="700" fill="#4a554e">AI</text><text x="55" y="465" font-size="18" font-weight="700" fill="#17231e">Inspect + sample</text><text x="55" y="490" font-size="14" font-weight="400" fill="#4a554e">Test reader settings</text><text x="55" y="510" font-size="14" font-weight="400" fill="#4a554e">Profile discovery rows</text></g></a><path d="M 260 474 H 280" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=mapping" aria-label="Propose mapping"><g><rect x="285" y="416" width="220" height="116" rx="7" fill="#e7f0e8" stroke="#80a58a" stroke-width="1.4"/><text x="300" y="439" font-size="11" font-weight="700" fill="#4a554e">AI</text><text x="300" y="465" font-size="18" font-weight="700" fill="#17231e">Propose mapping</text><text x="300" y="490" font-size="14" font-weight="400" fill="#4a554e">Ontology + transformations</text><text x="300" y="510" font-size="14" font-weight="400" fill="#4a554e">Confidence + unmapped</text></g></a><path d="M 505 474 H 525" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=mapping" aria-label="Validate + critique"><g><rect x="530" y="416" width="220" height="116" rx="7" fill="#e7f0e8" stroke="#80a58a" stroke-width="1.4"/><text x="545" y="439" font-size="11" font-weight="700" fill="#4a554e">CODE + AI</text><text x="545" y="465" font-size="18" font-weight="700" fill="#17231e">Validate + critique</text><text x="545" y="490" font-size="14" font-weight="400" fill="#4a554e">Execute held-out checks</text><text x="545" y="510" font-size="14" font-weight="400" fill="#4a554e">Inspect semantic meaning</text></g></a><path d="M 750 474 H 770" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=mapping" aria-label="Human decision"><g><rect x="775" y="416" width="220" height="116" rx="7" fill="#fbf2df" stroke="#b39354" stroke-width="2"/><text x="790" y="439" font-size="11" font-weight="700" fill="#4a554e">HUMAN</text><text x="790" y="465" font-size="18" font-weight="700" fill="#17231e">Human decision</text><text x="790" y="490" font-size="14" font-weight="400" fill="#4a554e">See rules + row evidence</text><text x="790" y="510" font-size="14" font-weight="400" fill="#4a554e">Accept or request changes</text></g></a><path d="M 995 474 H 1015" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=mapping" aria-label="Approved config"><g><rect x="1020" y="416" width="220" height="116" rx="7" fill="#edf0f2" stroke="#99a8b2" stroke-width="1.4"/><text x="1035" y="439" font-size="11" font-weight="700" fill="#4a554e">SAVED</text><text x="1035" y="465" font-size="18" font-weight="700" fill="#17231e">Approved config</text><text x="1035" y="490" font-size="14" font-weight="400" fill="#4a554e">8 human-verified mappings</text><text x="1035" y="510" font-size="14" font-weight="400" fill="#4a554e">Digest + source version</text></g></a><path d="M 640 532 V 565 H 395 V 537" fill="none" stroke="#63816e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 885 532 V 565 H 645" fill="none" stroke="#63816e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="40" y="595" font-size="14" font-weight="400" fill="#4a554e">Failed checks or requested changes return to the proposal. Bounded retries stop at a saved checkpoint.</text><text x="40" y="620" font-size="14" font-weight="400" fill="#4a554e">Later maintenance: seven local corrections, frozen-row validation, then human confirmation.</text><path d="M 1250 474 H 1260 V 652 H 20 V 799 H 35" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><text x="470" y="643" font-size="14" font-weight="600" fill="#235444">Reuse accepted rules</text><text x="40" y="693" font-size="24" font-weight="700" fill="#235444">03</text><text x="91" y="693" font-size="24" font-weight="700" fill="#17231e">Identify the same business</text><text x="91" y="718" font-size="13" font-weight="400" fill="#4a554e">PART 3 / Deterministic processing; no model API calls</text><a href="/?part=identity" aria-label="Extract observations"><g><rect x="40" y="741" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="55" y="764" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="55" y="790" font-size="18" font-weight="700" fill="#17231e">Extract observations</text><text x="55" y="815" font-size="14" font-weight="400" fill="#4a554e">7,744 saved rows</text><text x="55" y="835" font-size="14" font-weight="400" fill="#4a554e">85,446 field observations</text></g></a><path d="M 260 799 H 280" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=identity" aria-label="Generate candidates"><g><rect x="285" y="741" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="300" y="764" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="300" y="790" font-size="18" font-weight="700" fill="#17231e">Generate candidates</text><text x="300" y="815" font-size="14" font-weight="400" fill="#4a554e">ABN / ACN / names</text><text x="300" y="835" font-size="14" font-weight="400" fill="#4a554e">Place + domain evidence</text></g></a><path d="M 505 799 H 525" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=identity" aria-label="Score + decide"><g><rect x="530" y="741" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="545" y="764" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="545" y="790" font-size="18" font-weight="700" fill="#17231e">Score + decide</text><text x="545" y="815" font-size="14" font-weight="400" fill="#4a554e">Threshold 0.85</text><text x="545" y="835" font-size="14" font-weight="400" fill="#4a554e">1,455 proposed links</text></g></a><path d="M 750 799 H 770" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=identity" aria-label="Constrained clusters"><g><rect x="775" y="741" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="790" y="764" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="790" y="790" font-size="18" font-weight="700" fill="#17231e">Constrained clusters</text><text x="790" y="815" font-size="14" font-weight="400" fill="#4a554e">793 multi-source entities</text><text x="790" y="835" font-size="14" font-weight="400" fill="#4a554e">Canonical business keys</text></g></a><path d="M 995 799 H 1015" fill="none" stroke="#63816e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><a href="/?part=identity" aria-label="Review 50 links"><g><rect x="1020" y="741" width="220" height="116" rx="7" fill="#fbf2df" stroke="#b39354" stroke-width="2"/><text x="1035" y="764" font-size="11" font-weight="700" fill="#4a554e">HUMAN</text><text x="1035" y="790" font-size="18" font-weight="700" fill="#17231e">Review 50 links</text><text x="1035" y="815" font-size="14" font-weight="400" fill="#4a554e">46 pass / 4 fail = 92%</text><text x="1035" y="835" font-size="14" font-weight="400" fill="#4a554e">Failures retained + flagged</text></g></a><path d="M 640 857 V 877" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="530" y="882" width="220" height="64" rx="6" fill="#f7eee9" stroke="#c59c89"/><text x="545" y="906" font-size="16" font-weight="700" fill="#17231e">1,245 unlinked records</text><text x="545" y="929" font-size="14" font-weight="400" fill="#4a554e">Reason + candidate evidence</text><text x="40" y="903" font-size="16" font-weight="700" fill="#17231e">Separate relationship edges</text><text x="40" y="926" font-size="14" font-weight="400" fill="#4a554e">Licences / sites / programmes</text><path d="M 150 857 V 879" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><text x="1020" y="903" font-size="14" font-weight="400" fill="#4a554e">Audit flags only;</text><text x="1020" y="925" font-size="14" font-weight="400" fill="#4a554e">no automatic correction.</text><path d="M 885 857 V 997 H 20 V 1144 H 35" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><text x="470" y="988" font-size="14" font-weight="600" fill="#235444">Linked records + typed relationships</text><text x="40" y="1038" font-size="24" font-weight="700" fill="#235444">04</text><text x="91" y="1038" font-size="24" font-weight="700" fill="#17231e">Assemble a useful company profile</text><text x="91" y="1063" font-size="13" font-weight="400" fill="#4a554e">PART 4 / Deterministic assembly; no model API calls</text><a href="/?part=profiles" aria-label="Group claims"><g><rect x="40" y="1086" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="55" y="1109" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="55" y="1135" font-size="18" font-weight="700" fill="#17231e">Group claims</text><text x="55" y="1160" font-size="14" font-weight="400" fill="#4a554e">Separate business / sites</text><text x="55" y="1180" font-size="14" font-weight="400" fill="#4a554e">Licences + financial years</text></g></a><path d="M 260 1144 H 280" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=profiles" aria-label="Resolve conflicts"><g><rect x="285" y="1086" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="300" y="1109" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="300" y="1135" font-size="18" font-weight="700" fill="#17231e">Resolve conflicts</text><text x="300" y="1160" font-size="14" font-weight="400" fill="#4a554e">Choose by evidence strength</text><text x="300" y="1180" font-size="14" font-weight="400" fill="#4a554e">Keep alternatives + reasons</text></g></a><path d="M 505 1144 H 525" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=profiles" aria-label="Build profiles"><g><rect x="530" y="1086" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="545" y="1109" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="545" y="1135" font-size="18" font-weight="700" fill="#17231e">Build profiles</text><text x="545" y="1160" font-size="14" font-weight="400" fill="#4a554e">50 business profiles</text><text x="545" y="1180" font-size="14" font-weight="400" fill="#4a554e">Field confidence + origins</text></g></a><path d="M 750 1144 H 770" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=profiles" aria-label="Rebuild + compare"><g><rect x="775" y="1086" width="220" height="116" rx="7" fill="#ffffff" stroke="#cbd3c9" stroke-width="1.4"/><text x="790" y="1109" font-size="11" font-weight="700" fill="#4a554e">CODE</text><text x="790" y="1135" font-size="18" font-weight="700" fill="#17231e">Rebuild + compare</text><text x="790" y="1160" font-size="14" font-weight="400" fill="#4a554e">Remove one source</text><text x="790" y="1180" font-size="14" font-weight="400" fill="#4a554e">Check values + membership</text></g></a><path d="M 995 1144 H 1015" fill="none" stroke="#63816e" stroke-width="2"  marker-end="url(#arrow)"/><a href="/?part=profiles" aria-label="Explore the results"><g><rect x="1020" y="1086" width="220" height="116" rx="7" fill="#edf0f2" stroke="#99a8b2" stroke-width="1.4"/><text x="1035" y="1109" font-size="11" font-weight="700" fill="#4a554e">SAVED</text><text x="1035" y="1135" font-size="18" font-weight="700" fill="#17231e">Explore the results</text><text x="1035" y="1160" font-size="14" font-weight="400" fill="#4a554e">Source graphs + profiles</text><text x="1035" y="1180" font-size="14" font-weight="400" fill="#4a554e">Evidence + review exports</text></g></a><text x="40" y="1236" font-size="15" font-weight="400" fill="#4a554e">Remaining: complete nested-field confidence; test financial-source corruption.</text><rect x="40" y="1293" width="1200" height="76" rx="7" fill="#e9eee7"/><text x="60" y="1321" font-size="13" font-weight="700" fill="#235444">EVIDENCE TRAVELS WITH THE DATA</text><text x="60" y="1348" font-size="17" font-weight="400" fill="#17231e">Source snapshot  →  record ID  →  mapping digest  →  observation  →  link decision  →  profile field</text></svg>